<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OtklikHH — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#efe8dc;--bg2:#e4ddd0;--ink:#101c19;--muted:#4a5c56;--accent:#0b6e62;--accent2:#12a392;
  --soft:#d7f3ee;--coral:#e85d4c;--coral-soft:#ffe6e1;--card:#fffcf7;--edge:rgba(16,28,25,.08);
  --stat:#f3eee6;--row:#f7f2ea;--warn:#c45c12;--shadow:0 10px 28px rgba(16,28,25,.07);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{color:var(--ink);font:14px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(620px 320px at 92% -6%,rgba(18,163,146,.14),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.bar{position:sticky;top:0;z-index:30;background:rgba(239,232,220,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
.bin{width:min(1240px,calc(100% - 32px));margin:0 auto;height:58px;display:flex;align-items:center;gap:18px}
.lg{display:flex;align-items:center;gap:9px;font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:15px;letter-spacing:-.02em;flex:none}
.lg i{width:29px;height:29px;border-radius:10px;background:linear-gradient(140deg,var(--accent2),var(--accent));display:grid;place-items:center;font-style:normal;color:#eafaf6}
nav{display:flex;gap:3px;font-size:13.5px;font-weight:600;color:#33433e}
nav button{padding:7px 12px;border-radius:11px}
nav button.on{background:var(--card);box-shadow:var(--shadow);color:var(--accent)}
.wrap{width:min(1240px,calc(100% - 32px));margin:0 auto;padding:20px 0 48px}
h1{font-family:Unbounded,Manrope,sans-serif;font-size:22px;letter-spacing:-.025em;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#7b8a85;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2 .cnt{background:var(--stat);border-radius:7px;padding:2px 7px;font-size:11px;color:#5e6d67}
/* console */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 14px}
.k{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.k span{font-size:11.5px;color:var(--muted);font-weight:700}
.k b{display:block;font-size:25px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:5px;font-weight:800}
.k em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--accent)}
.k em.bad{color:var(--coral)}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.q{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:13px;background:var(--row);margin-bottom:7px;width:100%;text-align:left}
.q:hover{background:#f1ebe1}
.av{width:32px;height:32px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.qb{flex:1;min-width:0}
.qn{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.qm{font-size:11.5px;color:var(--muted)}
.pill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;flex:none}
.pill.a{background:var(--coral-soft);color:var(--coral)}
.pill.b{background:#fdf0dd;color:var(--warn)}
.pill.c{background:var(--soft);color:var(--accent)}
.chart{display:flex;align-items:flex-end;gap:9px;height:150px;padding-top:6px}
.bar2{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar2 i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--accent2),var(--accent));transition:height .5s}
.bar2 u{font-size:10.5px;color:#8a978f;text-decoration:none;font-weight:700}
.sk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--edge);font-size:13px}
.sk:last-child{border-bottom:0}
.sk b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800}
.sk .dot{width:8px;height:8px;border-radius:3px;background:var(--coral);flex:none}
.foot{margin-top:14px;font-size:11.5px;color:#7b8a85;font-weight:600;display:flex;align-items:center;gap:8px}
.foot .d{width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* mini app */
.app{width:min(420px,calc(100% - 24px));margin:20px auto 40px;background:var(--card);border:1px solid var(--edge);border-radius:28px;box-shadow:0 30px 70px rgba(16,28,25,.18);overflow:hidden;display:flex;flex-direction:column;height:min(760px,calc(100vh - 110px))}
.tgbar{height:42px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:13px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--edge);flex:none}
.tgbar b{color:var(--ink)}
.scr{flex:1;overflow-y:auto;padding:14px 16px 10px}
.hi{font-family:Unbounded,Manrope,sans-serif;font-size:21px;letter-spacing:-.03em;font-weight:700}
.hs{font-size:13px;color:var(--muted);margin-bottom:14px}
.hero{background:linear-gradient(145deg,var(--accent),#0a5c52);border-radius:22px;padding:17px;color:#eafaf6;box-shadow:0 14px 30px rgba(11,110,98,.26)}
.hero .lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.hero .sm{font-size:12.5px;opacity:.85}
.hbar{height:7px;border-radius:5px;background:rgba(255,255,255,.22);margin-top:13px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:5px;background:#eafaf6;transition:width .6s}
.hrow{display:flex;justify-content:space-between;font-size:11.5px;margin-top:7px;opacity:.85;font-weight:600}
.go{margin-top:13px;width:100%;height:46px;border-radius:14px;background:#fffcf7;color:var(--accent);font-weight:800;font-size:14.5px;border:1px solid var(--edge);box-shadow:0 8px 18px rgba(16,28,25,.1)}
.go[disabled]{opacity:.6}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.11em;color:#7b8a85;font-weight:800;margin:18px 0 9px}
.pulse{display:flex;gap:9px}
.pcell{flex:1;background:var(--stat);border-radius:14px;padding:10px 11px}
.pcell b{display:block;font-size:19px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.pcell span{font-size:11px;color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px dashed var(--edge)}
.item:last-child{border-bottom:0}
.lo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:#fff}
.ib{flex:1;min-width:0}
.it{font-size:13.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is{font-size:11.5px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;flex:none}
.tag.ok{background:var(--soft);color:var(--accent)}
.tag.new{background:var(--coral-soft);color:var(--coral)}
.tag.wait{background:#fdf0dd;color:var(--warn)}
.dock{height:70px;border-top:1px solid var(--edge);background:rgba(255,252,247,.96);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;flex:none}
.d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:#8a978f;height:100%;justify-content:center}
.d.on{color:var(--accent)}
.d i{width:34px;height:26px;display:grid;place-items:center;border-radius:8px}
.d.on i{background:var(--soft)}
.chatline{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--edge)}
.bub{background:var(--stat);border-radius:12px;padding:9px 11px;font-size:12.5px;max-width:78%}
.bub.me{background:var(--soft);margin-left:auto}
/* bot */
.phone{width:min(430px,calc(100% - 24px));margin:20px auto 40px;border-radius:24px;overflow:hidden;background:#17212b;box-shadow:0 30px 70px rgba(16,28,25,.25);display:flex;flex-direction:column;height:min(720px,calc(100vh - 110px))}
.tgh{height:54px;display:flex;align-items:center;gap:11px;padding:0 15px;background:#1f2c3a;flex:none}
.tga{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#12a392,#0b6e62);display:grid;place-items:center;font-size:12px;font-weight:800;color:#eafaf6}
.body{flex:1;padding:14px 13px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;background:#0e1621}
.m{max-width:88%;background:#182533;border-radius:13px 13px 13px 4px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:#e9f0f7;flex:none;animation:pop .22s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m.me{align-self:flex-end;background:#2b5278;border-radius:13px 13px 4px 13px}
.m .t{font-weight:800;color:#6fe0cb;margin-bottom:5px;font-size:13px}
.m .ln{display:flex;justify-content:space-between;gap:10px;padding:1.5px 0;color:#b9c9d8}
.m .ln b{color:#e9f0f7;font-variant-numeric:tabular-nums}
.kb{display:grid;gap:4px;margin-top:9px}
.kb2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.kbtn{background:rgba(18,163,146,.16);border:1px solid rgba(18,163,146,.3);border-radius:8px;padding:8px;text-align:center;font-size:11.5px;font-weight:700;color:#8fe8d8;width:100%}
.kbtn:hover{background:rgba(18,163,146,.3)}
.kbtn.b{background:rgba(232,93,76,.14);border-color:rgba(232,93,76,.3);color:#ffb3a8}
.tm{font-size:10px;color:#7d8e9e;text-align:right;margin-top:5px}
.day{align-self:center;font-size:10.5px;color:#8aa0b4;background:rgba(0,0,0,.3);padding:3px 10px;border-radius:999px;flex:none}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:6px;height:6px;border-radius:50%;background:#6d7f8f;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.inp{height:48px;border-top:1px solid rgba(0,0,0,.3);background:#17212b;display:flex;align-items:center;padding:0 13px;gap:9px;font-size:12.5px;color:#6d7f8f;flex:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101c19;color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media(max-width:900px){.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}nav button{padding:7px 9px;font-size:12.5px}}
</style>
</head>
<body>
<div class="bar"><div class="bin">
  <div class="lg"><i><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#eafaf6" stroke-width="2.2"><path d="M21 3 2.5 10.5l7.5 2.8L12.8 21z"/></svg></i>OtklikHH</div>
  <nav id="nav">
    <button data-go="app" class="on">Мини-приложение</button>
    <button data-go="console">Операторская</button>
    <button data-go="bot">Бот</button>
  </nav>
</div></div>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const VAC = [
  {c:"SB",n:"Senior Frontend · React",t:"09:41 · шаблон «fullstack»",s:"new",col:"linear-gradient(140deg,#12a392,#0b6e62)"},
  {c:"YA",n:"Fullstack TypeScript",t:"09:41 · шаблон «fullstack»",s:"ok",col:"linear-gradient(140deg,#5b94ff,#2a5fd6)"},
  {c:"VK",n:"React Native разработчик",t:"09:40 · требуется сопроводительное",s:"wait",col:"linear-gradient(140deg,#e85d4c,#c13c2c)"},
  {c:"OZ",n:"Node.js / Hono backend",t:"09:40 · шаблон «backend»",s:"ok",col:"linear-gradient(140deg,#8b5cf6,#6d35e0)"},
  {c:"AV",n:"Team Lead Frontend",t:"09:39 · шаблон «lead»",s:"ok",col:"linear-gradient(140deg,#0ea5e9,#0369a1)"},
  {c:"TN",n:"React разработчик (middle+)",t:"09:39 · вакансия уже с откликом",s:"wait",col:"linear-gradient(140deg,#f0893a,#d0631c)"},
];
const TAGS = {ok:["ok","отправлен"],new:["new","ответ"],wait:["wait","пропуск"]};
const QUEUE = [
  {i:"АК",n:"client #1841 · Артём К.",m:"сессия hh протухла — нужен повторный вход",p:"a",l:"блок"},
  {i:"МЛ",n:"client #1822 · Марина Л.",m:"капча на 3 попытках подряд, прокси ru-7",p:"a",l:"блок"},
  {i:"ДП",n:"client #1790 · Денис П.",m:"пакет кончится через 4 отклика",p:"b",l:"скоро"},
  {i:"ИС",n:"client #1774 · Иван С.",m:"шаблон письма пустой — отклики на паузе",p:"b",l:"скоро"},
  {i:"ОВ",n:"client #1756 · Ольга В.",m:"оплата прошла, джоба в очереди",p:"c",l:"ок"},
  {i:"ПР",n:"client #1731 · Павел Р.",m:"11 новых чатов от работодателей",p:"c",l:"ок"},
  {i:"НГ",n:"client #1702 · Никита Г.",m:"прокси ru-3 отвечает дольше 8 с",p:"b",l:"скоро"},
  {i:"ЕМ",n:"client #1688 · Елена М.",m:"пачка 50/50 отправлена без пропусков",p:"c",l:"ок"},
];
const state = {page:"app",tab:"home",sent:50,running:false,chat:0};
const $=s=>document.querySelector(s);
let tid; const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tid);tid=setTimeout(()=>t.classList.remove("show"),2100);};

function miniapp(){
  const tabs = {home:homeTab,ottik:ottikTab,chats:chatsTab,more:moreTab};
  return `<div class="app">
    <div class="tgbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a5c56" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      <b>OtklikHH</b> · мини-приложение
    </div>
    <div class="scr" id="scr">${(tabs[state.tab]||homeTab)()}</div>
    <div class="dock">
      ${[["home","Главная",'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],
         ["ottik","Оттик",'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'],
         ["chats","Чаты",'<path d="M21 12a8 8 0 1 1-3.1-6.3"/><path d="M3.5 20.5 5 16"/>'],
         ["more","Ещё",'<path d="M4 7h16M4 12h16M4 17h10"/>']].map(([id,label,path])=>`
        <button class="d ${state.tab===id?"on":""}" data-tab="${id}">
          <i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">${path}</svg></i>${label}</button>`).join("")}
    </div>
  </div>`;
}
function homeTab(){
  const pct = Math.round(state.sent/50*100);
  return `
    <div class="hi">Привет, Артём</div>
    <div class="hs">Пакет «Про» · осталось ${171-state.sent} откликов</div>
    <div class="hero">
      <div class="lb">сегодня отправлено</div>
      <div class="big">${state.sent}</div>
      <div class="sm">из 50 по фильтру «React, Москва, от 250к»</div>
      <div class="hbar"><i style="width:${pct}%"></i></div>
      <div class="hrow"><span>${state.running?"идёт пачка…":"пачка 6 мин 12 с"}</span><span>пропущено ${Math.round(state.sent*0.14)}</span></div>
    </div>
    <button class="go" data-run="1" ${state.running?"disabled":""}>${state.running?"Отправляю…":"Запустить новую пачку"}</button>
    <h3>Пульс hh</h3>
    <div class="card" style="padding:13px"><div class="pulse">
      <div class="pcell"><b>${312+state.sent*2}</b><span>просмотров</span></div>
      <div class="pcell"><b>24</b><span>приглашений</span></div>
      <div class="pcell"><b>3</b><span>новых чата</span></div>
    </div></div>
    <h3>Отклики</h3>
    <div class="card" style="padding:13px">
      ${VAC.slice(0,4).map(v=>`<div class="item"><span class="lo" style="background:${v.col}">${v.c}</span>
        <span class="ib"><span class="it" style="display:block">${v.n}</span><span class="is" style="display:block">${v.t}</span></span>
        <span class="tag ${TAGS[v.s][0]}">${TAGS[v.s][1]}</span></div>`).join("")}
    </div>`;
}
function ottikTab(){
  return `<div class="hi">Оттик</div><div class="hs">Все отклики за сегодня — ${VAC.length} из ${state.sent}</div>
    <div class="card" style="padding:13px">
      ${VAC.map(v=>`<div class="item"><span class="lo" style="background:${v.col}">${v.c}</span>
        <span class="ib"><span class="it" style="display:block">${v.n}</span><span class="is" style="display:block">${v.t}</span></span>
        <span class="tag ${TAGS[v.s][0]}">${TAGS[v.s][1]}</span></div>`).join("")}
    </div>
    <h3>Почему пропускаем</h3>
    <div class="card" style="padding:13px">
      <div class="sk"><span class="dot"></span>вакансия уже с откликом<b>74</b></div>
      <div class="sk"><span class="dot" style="background:var(--warn)"></span>требуется сопроводительное<b>41</b></div>
      <div class="sk"><span class="dot" style="background:var(--warn)"></span>капча на шаге отклика<b>33</b></div>
    </div>`;
}
function chatsTab(){
  return `<div class="hi">Чаты с hh</div><div class="hs">3 новых ответа от работодателей</div>
    <div class="card" style="padding:13px">
      <div class="item"><span class="lo" style="background:linear-gradient(140deg,#12a392,#0b6e62)">SB</span>
        <span class="ib"><span class="it" style="display:block">Senior Frontend · React</span><span class="is" style="display:block">Здравствуйте! Когда удобно созвониться?</span></span>
        <span class="tag new">новое</span></div>
      <div class="chatline"><div class="bub">Здравствуйте! Когда удобно созвониться на 30 минут?</div></div>
      <div class="chatline"><div class="bub me">Добрый день! Завтра после 15:00 по Москве.</div></div>
      <div class="chatline"><div class="bub">Отлично, пришлю приглашение.</div></div>
    </div>
    <h3>Другие</h3>
    <div class="card" style="padding:13px">
      <div class="item"><span class="lo" style="background:linear-gradient(140deg,#5b94ff,#2a5fd6)">YA</span>
        <span class="ib"><span class="it" style="display:block">Fullstack TypeScript</span><span class="is" style="display:block">Тестовое задание во вложении</span></span><span class="tag ok">прочитано</span></div>
      <div class="item"><span class="lo" style="background:linear-gradient(140deg,#8b5cf6,#6d35e0)">OZ</span>
        <span class="ib"><span class="it" style="display:block">Node.js / Hono backend</span><span class="is" style="display:block">Спасибо за отклик, вернёмся позже</span></span><span class="tag wait">отказ</span></div>
    </div>`;
}
function moreTab(){
  return `<div class="hi">Ещё</div><div class="hs">Анкеты, пакет и шаблоны писем</div>
    <h3>Анкеты</h3>
    <div class="card" style="padding:13px">
      <div class="item"><span class="lo" style="background:linear-gradient(140deg,#0b6e62,#073f38)">1</span>
        <span class="ib"><span class="it" style="display:block">Fullstack React / TS</span><span class="is" style="display:block">основная · 41 отклик за неделю</span></span><span class="tag ok">вкл</span></div>
      <div class="item"><span class="lo" style="background:linear-gradient(140deg,#8a978f,#5e6d67)">2</span>
        <span class="ib"><span class="it" style="display:block">Node.js backend</span><span class="is" style="display:block">запасная · 9 откликов</span></span><span class="tag wait">выкл</span></div>
    </div>
    <h3>Пакет</h3>
    <div class="card" style="padding:13px"><div class="pulse">
      <div class="pcell"><b>${171-state.sent}</b><span>осталось</span></div>
      <div class="pcell"><b>12.12</b><span>действует до</span></div>
    </div></div>
    <h3>Шаблон письма</h3>
    <div class="card" style="padding:13px;font-size:12.5px;color:var(--muted);line-height:1.6">
      «Здравствуйте! Меня зовут {name}, делаю фронт и бэк на React/TypeScript и Node. Резюме приложил, готов обсудить задачу.»
    </div>`;
}

function consoleView(){
  const bars=[46,62,54,78,88,41,100];
  return `<div class="wrap">
    <h1>Операторская · обзор</h1>
    <div class="sub">Клиенты, джобы, прокси и выручка. Очередь внимания собирается из событий воркера.</div>
    <div class="kpis">
      <div class="k"><span>Откликов за сутки</span><b>4 812</b><em>+12% к вчера</em></div>
      <div class="k"><span>Успешных</span><b>96.4%</b><em>174 пропуска</em></div>
      <div class="k"><span>Активных сессий hh</span><b>187</b><em>из 214 клиентов</em></div>
      <div class="k"><span>Выручка (paid)</span><b>96 400 ₽</b><em class="bad">−3% к неделе</em></div>
    </div>
    <div class="two">
      <div class="card">
        <h2>Очередь внимания <span class="cnt">${QUEUE.length}</span></h2>
        ${QUEUE.map(q=>`<button class="q" data-cl="${q.n}"><span class="av">${q.i}</span>
          <span class="qb"><span class="qn" style="display:block">${q.n}</span><span class="qm" style="display:block">${q.m}</span></span>
          <span class="pill ${q.p}">${q.l}</span></button>`).join("")}
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card"><h2>Отклики по дням</h2>
          <div class="chart">${bars.map((b,i)=>`<span class="bar2"><i style="height:${b}%"></i><u>${["пн","вт","ср","чт","пт","сб","вс"][i]}</u></span>`).join("")}</div>
        </div>
        <div class="card"><h2>Пропуски (top)</h2>
          <div class="sk"><span class="dot"></span>вакансия уже с откликом<b>74</b></div>
          <div class="sk"><span class="dot" style="background:var(--warn)"></span>требуется сопроводительное<b>41</b></div>
          <div class="sk"><span class="dot" style="background:var(--warn)"></span>капча на шаге отклика<b>33</b></div>
          <div class="sk"><span class="dot" style="background:var(--accent)"></span>фильтр клиента не совпал<b>26</b></div>
        </div>
      </div>
    </div>
    <div class="foot"><span class="d"></span>Bun · Hono · grammY · Playwright · Drizzle/SQLite · Docker Compose — пакеты domain, hh-apply, payments, notify, antifraud</div>
  </div>`;
}

function botView(){
  return `<div class="phone">
    <div class="tgh"><div class="tga">OH</div><div><div style="font-size:13.5px;font-weight:700;color:#fff">OtklikHH</div><div style="font-size:11px;color:#7d8e9e">бот · онлайн</div></div></div>
    <div class="body" id="chat"><div class="day">сегодня</div></div>
    <div class="inp"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6d7f8f" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Меню · Отклики · Пакет · Анкеты</div>
  </div>`;
}

const now=()=>new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function addMsg(html,me){const b=$("#chat");if(!b)return;const d=document.createElement("div");d.className="m"+(me?" me":"");d.innerHTML=html;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function typing(ms){return new Promise(r=>{const b=$("#chat");if(!b)return r();const d=document.createElement("div");d.className="m";d.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';b.appendChild(d);b.scrollTop=b.scrollHeight;setTimeout(()=>{d.remove();r();},ms);});}

async function botStart(){
  $("#chat").innerHTML='<div class="day">сегодня</div>';
  addMsg(`<div class="t">⚡️ Пачка отправлена</div>
    <div class="ln"><span>Фильтр</span><b>React, Москва, от 250к</b></div>
    <div class="ln"><span>Отправлено</span><b>50 откликов</b></div>
    <div class="ln"><span>Пропущено</span><b>7</b></div>
    <div class="ln"><span>Заняло</span><b>6 мин 12 с</b></div>
    <div class="kb"><div class="kb2"><button class="kbtn" data-b="report">Отчёт</button><button class="kbtn" data-b="again">Повторить</button></div>
      <button class="kbtn" data-b="pack">Остаток пакета</button></div>
    <div class="tm">09:41</div>`);
}

function render(){
  const v={app:miniapp,console:consoleView,bot:botView};
  $("#app").innerHTML=(v[state.page]||miniapp)();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===state.page));
  if(state.page==="bot") botStart();
}
function go(p){state.page=p;const h="#/"+p;if(location.hash!==h)location.hash=h;render();window.scrollTo({top:0});}

document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-go],[data-tab],[data-run],[data-cl],[data-b]");
  if(!t)return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.tab){ state.tab=t.dataset.tab; return render(); }
  if(t.dataset.cl){ return toast(t.dataset.cl.split("·")[1].trim()+" — карточка клиента открылась бы здесь"); }
  if(t.dataset.run){
    if(state.running) return;
    state.running=true; state.sent=0; render();
    const timer=setInterval(()=>{
      state.sent+=Math.ceil(Math.random()*6);
      if(state.sent>=50){ state.sent=50; state.running=false; clearInterval(timer); toast("Пачка 50/50 отправлена · 7 пропусков, отчёт ушёл в бот"); }
      render();
    },260);
    return;
  }
  const b=t.dataset.b;
  if(b==="report"){ addMsg(`Отчёт<div class="tm">${now()}</div>`,true); await typing(600);
    addMsg(`<div class="t">📊 Отчёт по пачке</div>
      <div class="ln"><span>Отправлено</span><b>50</b></div>
      <div class="ln"><span>Уже был отклик</span><b>4</b></div>
      <div class="ln"><span>Нужно сопроводительное</span><b>2</b></div>
      <div class="ln"><span>Капча</span><b>1</b></div>
      <div class="kb"><button class="kbtn b" data-go="app">Открыть мини-приложение</button></div>
      <div class="tm">${now()}</div>`); return; }
  if(b==="again"){ addMsg(`Повторить<div class="tm">${now()}</div>`,true); await typing(900);
    addMsg(`<div class="t">⚡️ Запускаю ещё одну пачку</div>Работаю по тому же фильтру. Напишу, когда закончу.<div class="tm">${now()}</div>`); return; }
  if(b==="pack"){ addMsg(`Остаток пакета?<div class="tm">${now()}</div>`,true); await typing(500);
    addMsg(`<div class="t">📦 Пакет «Про»</div>
      <div class="ln"><span>Осталось</span><b>121 отклик</b></div>
      <div class="ln"><span>Действует до</span><b>12.12</b></div>
      <div class="kb"><button class="kbtn" data-b="pay">Продлить</button></div><div class="tm">${now()}</div>`); return; }
  if(b==="pay"){ addMsg(`<div class="t">💳 Счёт выставлен</div>В демо оплата отключена — в проде тут ссылка на кассу.<div class="tm">${now()}</div>`); return; }
});

function fromHash(){
  const w=(location.hash||"").replace(/^#\/?/,"").trim();
  state.page=["app","console","bot"].includes(w)?w:"app";
  render();
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
