<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>True Protein — демо магазина</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#070b14;--fg:#f4f7ff;--accent:#3d7eff;--muted:#9db0d0;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{color:var(--fg);font:15px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(1200px 600px at 10% -10%,rgba(61,126,255,.25),transparent 55%),
             radial-gradient(900px 500px at 90% 0%,rgba(30,90,180,.2),transparent 50%),var(--bg);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.shell{width:min(1230px,calc(100% - 32px));margin:0 auto}
.topbar{height:34px;display:flex;align-items:center;font-size:12px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06)}
.topbar b{color:#cfe0ff;font-weight:700}
header{position:sticky;top:0;z-index:30;background:rgba(7,11,20,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hin{height:68px;display:flex;align-items:center;gap:22px}
.logo{font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex:none}
.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,#5b94ff,#2a5fd6);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
nav{display:flex;gap:3px;font-size:13.5px;font-weight:600;color:#b8c7e4}
nav button{padding:8px 12px;border-radius:10px}
nav button.on{background:rgba(61,126,255,.15);color:#9dc0ff}
nav button:hover:not(.on){background:rgba(255,255,255,.05)}
.hact{margin-left:auto;display:flex;align-items:center;gap:10px}
.icbtn{height:38px;min-width:38px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:7px;position:relative;font-size:13px;font-weight:700}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-top:24px}
.heroL{border:1px solid var(--line);border-radius:22px;padding:28px;background:radial-gradient(540px 260px at 8% 0%,rgba(61,126,255,.22),transparent 60%),rgba(255,255,255,.035)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9dc0ff;border:1px solid rgba(61,126,255,.35);background:rgba(61,126,255,.1);padding:5px 11px;border-radius:999px}
h1{font-family:Unbounded,Manrope,sans-serif;font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:15px 0 10px;font-weight:800}
.lead{color:var(--muted);font-size:14.5px;max-width:470px;line-height:1.55}
.goals{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px}
.goal{border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:rgba(255,255,255,.035);display:flex;flex-direction:column;justify-content:center;text-align:left;transition:.15s}
.goal:hover{border-color:rgba(61,126,255,.4);background:rgba(61,126,255,.08)}
.goal.on{border-color:var(--accent);background:rgba(61,126,255,.16);box-shadow:0 10px 26px -12px rgba(61,126,255,.6)}
.goal b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.goal span{font-size:11.5px;color:var(--muted)}
.goal i{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;margin-bottom:10px;background:rgba(61,126,255,.16);border:1px solid rgba(61,126,255,.26)}
.sect{display:flex;align-items:flex-end;justify-content:space-between;margin:26px 0 14px;gap:16px}
.sect h2{font-family:Unbounded,Manrope,sans-serif;font-size:20px;letter-spacing:-.02em;font-weight:700}
.sect span{font-size:13px;color:var(--muted);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:40px}
.p{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.p:hover{transform:translateY(-3px);border-color:rgba(61,126,255,.4)}
.shot{height:138px;position:relative;display:grid;place-items:center}
.jar{width:60px;height:86px;border-radius:12px 12px 10px 10px;position:relative;box-shadow:0 14px 28px rgba(0,0,0,.4)}
.jar:before{content:"";position:absolute;left:12px;right:12px;top:-9px;height:12px;border-radius:5px;background:rgba(255,255,255,.22)}
.jar:after{content:"";position:absolute;left:9px;right:9px;top:30px;height:26px;border-radius:5px;background:rgba(255,255,255,.14)}
.tagd{position:absolute;top:11px;left:11px;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:4px 8px;border-radius:7px;background:rgba(61,126,255,.18);border:1px solid rgba(61,126,255,.35);color:#b7d0ff}
.tagd.hit{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.38);color:#ffcd73}
.pb{padding:13px 14px 15px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;flex:1}
.brand{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7f93b5;font-weight:700}
.pn{font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin:4px 0 8px;line-height:1.3}
.prow{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.pp{font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pp s{display:block;font-size:11.5px;font-weight:600;color:#6d80a2;text-decoration:none}
.add{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 18px rgba(61,126,255,.3);transition:.15s}
.add:hover{transform:scale(1.08)}
.add.in{background:#1f9d5e}
.strip{margin:4px 0 36px;display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:16px;padding:13px 18px;background:linear-gradient(100deg,rgba(61,126,255,.14),rgba(255,255,255,.03))}
.code{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:13px;font-weight:700;letter-spacing:.12em;color:#9dc0ff;border:1px dashed rgba(61,126,255,.5);border-radius:10px;padding:7px 14px}
/* cart */
.cart{display:grid;grid-template-columns:1fr 330px;gap:18px;margin:24px 0 48px;align-items:start}
.ci{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:13px;background:rgba(255,255,255,.035);margin-bottom:10px}
.cj{width:44px;height:58px;border-radius:9px;flex:none}
.cb{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.qty button{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-weight:800}
.qty b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.sum{border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(255,255,255,.04);position:sticky;top:110px}
.sr{display:flex;justify-content:space-between;padding:6px 0;color:var(--muted);font-size:13.5px}
.sr b{color:var(--fg);font-variant-numeric:tabular-nums}
.sr.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:17px;color:var(--fg);font-weight:800}
.promo{display:flex;gap:8px;margin:12px 0}
.promo input{flex:1;height:40px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--fg);padding:0 12px;outline:0;font-size:13.5px}
.promo input:focus{border-color:var(--accent)}
.promo button{height:40px;padding:0 15px;border-radius:11px;background:rgba(255,255,255,.08);font-weight:700;font-size:13.5px}
.b1{width:100%;height:46px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:14.5px;margin-top:6px;box-shadow:0 12px 28px -10px rgba(61,126,255,.8)}
.b2{height:44px;padding:0 18px;border-radius:12px;border:1px solid rgba(255,255,255,.14);color:#dbe6fb;font-weight:600;font-size:14px}
.cta{display:flex;gap:10px;margin-top:20px}
.empty{border:1px dashed var(--line);border-radius:18px;padding:40px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:6px;font-size:16px}
/* admin */
.adm{display:grid;grid-template-columns:1fr 360px;gap:18px;margin:24px 0 48px;align-items:start}
table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.025)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#7f93b5;text-align:left;padding:11px 13px;background:rgba(255,255,255,.03);font-weight:700}
td{padding:12px 13px;border-top:1px solid rgba(255,255,255,.06);font-size:13.5px;color:#dbe6fb}
tr.sel td{background:rgba(61,126,255,.1)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#9dc0ff}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap}
.st:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.new{color:#9dc0ff;background:rgba(61,126,255,.14)}
.st.pay{color:#ffcd73;background:rgba(255,176,32,.13)}
.st.ship{color:#7dffb3;background:rgba(125,255,179,.12)}
.st.done{color:#8ea2c4;background:rgba(255,255,255,.06)}
.tg{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#17212b;position:sticky;top:110px}
.tgh{height:52px;display:flex;align-items:center;gap:11px;padding:0 15px;background:#1f2c3a}
.tga{width:33px;height:33px;border-radius:50%;background:linear-gradient(140deg,#5b94ff,#2a5fd6);display:grid;place-items:center;font-size:12px;font-weight:800}
.tgb{padding:14px 13px;background:#0e1621;min-height:300px}
.msg{background:#182533;border-radius:14px 14px 14px 5px;padding:11px 13px;font-size:12.5px;line-height:1.5;color:#e9f0f7}
.msg .ttl{font-weight:800;font-size:13px;margin-bottom:7px;color:#9dc0ff}
.ln{display:flex;justify-content:space-between;gap:12px;padding:2.5px 0;color:#b9c9d8}
.ln b{color:#e9f0f7;font-variant-numeric:tabular-nums}
.msg hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:8px 0}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.kbtn{background:rgba(61,126,255,.16);border:1px solid rgba(61,126,255,.3);border-radius:9px;padding:8px;text-align:center;font-size:12px;font-weight:700;color:#bcd5ff}
.kbtn:hover{background:rgba(61,126,255,.28)}
.kbtn.on{background:#1f9d5e;border-color:#1f9d5e;color:#eafff3}
.hintbar{font-size:11.5px;color:#6d80a2;margin-top:10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0d1424;border:1px solid var(--line);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media(max-width:1000px){
  .hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}
  .cart,.adm{grid-template-columns:1fr}.sum,.tg{position:static}
  nav{display:none}h1{font-size:27px}
}
@media(max-width:560px){.cards{grid-template-columns:1fr}.goals{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div class="shell topbar">Доставка по РБ и РФ · самовывоз в Минске · <b>&nbsp;оплата при получении</b></div>
  <div class="shell hin">
    <div class="logo"><i>TP</i>TRUE PROTEIN</div>
    <nav id="nav">
      <button data-go="shop" class="on">Каталог</button>
      <button data-go="cart">Корзина</button>
      <button data-go="admin">Админка</button>
    </nav>
    <div class="hact">
      <button class="icbtn" data-go="cart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="2"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h3l2.6 12.3a2 2 0 0 0 2 1.7h8.2a2 2 0 0 0 2-1.5L22 8H6.3"/></svg>
        <span id="cartSum">0 ₽</span>
        <span class="badge" id="cartN" hidden>0</span>
      </button>
    </div>
  </div>
</header>

<main class="shell" id="app"></main>
<div class="toast" id="toast"></div>

<script>
const GOALS = [
  {id:"mass",n:"Масса",ic:"bars-up"},{id:"cut",n:"Сушка",ic:"bars-down"},
  {id:"energy",n:"Энергия",ic:"bolt"},{id:"joints",n:"Суставы",ic:"clock"},
  {id:"immune",n:"Иммунитет",ic:"heart"},{id:"sleep",n:"Сон",ic:"moon"},
];
const P = [
  {id:1,b:"Optimum",n:"Whey Protein 100% · 2.27 кг",price:5670,per:"189 ₽ / порция 30 г",c:"linear-gradient(160deg,#2f4a86,#15233f)",tag:"ХИТ",hit:true,goals:["mass","cut"]},
  {id:2,b:"Scitec",n:"Creatine Monohydrate · 500 г",price:1180,per:"79 ₽ / порция 5 г",c:"linear-gradient(160deg,#6d5423,#2a2010)",tag:"−15%",goals:["mass","energy"]},
  {id:3,b:"Maxler",n:"BCAA 2:1:1 Powder · 420 г",price:1640,per:"118 ₽ / порция 7 г",c:"linear-gradient(160deg,#1f6049,#0d2a21)",tag:"НОВОЕ",goals:["cut","energy"]},
  {id:4,b:"NOW",n:"Omega-3 1000 мг · 180 капсул",price:1290,per:"64 ₽ / порция 2 капс.",c:"linear-gradient(160deg,#54306b,#231330)",tag:"ХИТ",hit:true,goals:["joints","immune"]},
  {id:5,b:"Solgar",n:"Vitamin D3 2000 IU · 120 капсул",price:980,per:"18 ₽ / порция",c:"linear-gradient(160deg,#7a5a1d,#2e2008)",goals:["immune","joints"]},
  {id:6,b:"Maxler",n:"Collagen Powder · 300 г",price:1870,per:"94 ₽ / порция 10 г",c:"linear-gradient(160deg,#355a7a,#122330)",goals:["joints"]},
  {id:7,b:"NOW",n:"Magnesium Glycinate · 180 капсул",price:1420,per:"31 ₽ / порция",c:"linear-gradient(160deg,#2b5f5a,#0f2422)",goals:["sleep","immune"]},
  {id:8,b:"Scitec",n:"Gainer 3 кг · шоколад",price:5290,per:"241 ₽ / порция 100 г",c:"linear-gradient(160deg,#5a3320,#24140c)",goals:["mass"]},
];
const ORDERS = [
  {id:"#1042",cl:"Артём К.",items:"Whey 2.27 кг · Creatine 500 г",sum:6180,promo:"TRUE10",st:"new",t:"14:22"},
  {id:"#1041",cl:"Марина Л.",items:"Omega-3 · Collagen",sum:2940,promo:"",st:"pay",t:"13:50"},
  {id:"#1040",cl:"Денис П.",items:"BCAA 420 г",sum:1180,promo:"TRUE10",st:"ship",t:"12:08"},
  {id:"#1039",cl:"Иван С.",items:"Whey 900 г · Shaker",sum:3420,promo:"",st:"ship",t:"11:31"},
  {id:"#1038",cl:"Ольга В.",items:"Vitamin D3 · Magnesium",sum:1760,promo:"",st:"done",t:"10:04"},
];
const ST = {new:["new","Новый"],pay:["pay","Оплачен"],ship:["ship","Отправлен"],done:["done","Выдан"]};

const state = {page:"shop",goal:null,cart:{},promo:"TRUE10",promoOn:false,sel:"#1042",orders:ORDERS.map(o=>({...o}))};
const fmt = n => n.toLocaleString("ru-RU");
const $ = s => document.querySelector(s);
let tid; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tid); tid=setTimeout(()=>t.classList.remove("show"),1900); };

const ICONS = {
  "bars-up":'<span style="display:flex;gap:2.5px;align-items:flex-end;height:14px"><i style="width:3px;height:6px;border-radius:2px;background:#8ab4ff"></i><i style="width:3px;height:10px;border-radius:2px;background:#8ab4ff"></i><i style="width:3px;height:14px;border-radius:2px;background:#8ab4ff"></i></span>',
  "bars-down":'<span style="display:flex;gap:2.5px;align-items:flex-end;height:14px"><i style="width:3px;height:14px;border-radius:2px;background:#8ab4ff"></i><i style="width:3px;height:9px;border-radius:2px;background:#8ab4ff"></i><i style="width:3px;height:5px;border-radius:2px;background:#8ab4ff"></i></span>',
  bolt:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8ab4ff" stroke-width="2.2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  clock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8ab4ff" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>',
  heart:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8ab4ff" stroke-width="2.2"><path d="M12 21s-8-5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6-8 11-8 11z"/></svg>',
  moon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8ab4ff" stroke-width="2.2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
};
const plus = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>';
const check = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

const cartList = () => Object.entries(state.cart).map(([id,q])=>({p:P.find(x=>x.id===+id),q})).filter(x=>x.p);
const subtotal = () => cartList().reduce((s,x)=>s+x.p.price*x.q,0);
const discount = () => state.promoOn ? Math.round(subtotal()*0.1) : 0;
const total = () => Math.max(0, subtotal()-discount());
const cartCount = () => cartList().reduce((s,x)=>s+x.q,0);

function shop(){
  const list = state.goal ? P.filter(p=>p.goals.includes(state.goal)) : P;
  const g = GOALS.find(x=>x.id===state.goal);
  return `
  <section class="hero">
    <div class="heroL">
      <span class="pill">Своя платформа вместо Tilda</span>
      <h1>Спортпит под твою цель,<br/>а не под витрину</h1>
      <div class="lead">Выбери цель — каталог пересоберётся под неё. Корзина, промокод и заказы живут в одной базе с админкой и Telegram-ботом.</div>
      <div class="cta">
        <button class="b2" data-goal="">Показать весь каталог · ${P.length}</button>
        <button class="b2" data-go="admin">Открыть админку</button>
      </div>
    </div>
    <div class="goals">
      ${GOALS.map(x=>`<button class="goal ${state.goal===x.id?"on":""}" data-goal="${x.id}">
        <i>${ICONS[x.ic]}</i><b>${x.n}</b><span>${P.filter(p=>p.goals.includes(x.id)).length} добавок</span></button>`).join("")}
    </div>
  </section>

  <div class="sect">
    <h2>${g ? "Стек под цель «"+g.n+"»" : "Хиты продаж"}</h2>
    <span>${g ? list.length+" позиции подобраны по цели" : "Импортировано из Tilda — 412 позиций, 38 брендов"}</span>
  </div>
  <div class="cards">
    ${list.map(p=>{
      const inCart = !!state.cart[p.id];
      return `<div class="p">
        <div class="shot" style="background:radial-gradient(130px 90px at 50% 40%,rgba(61,126,255,.18),transparent 70%)">
          ${p.tag?`<span class="tagd ${p.hit?"hit":""}">${p.tag}</span>`:""}
          <div class="jar" style="background:${p.c}"></div>
        </div>
        <div class="pb">
          <div class="brand">${p.b}</div><div class="pn">${p.n}</div>
          <div class="prow">
            <div class="pp">${fmt(p.price)} ₽<s>${p.per}</s></div>
            <button class="add ${inCart?"in":""}" data-add="${p.id}" title="${inCart?"В корзине":"В корзину"}">${inCart?check:plus}</button>
          </div>
        </div>
      </div>`;}).join("")}
  </div>

  <div class="strip">
    <div><b style="font-size:14px">Промокод на первый заказ</b><br/><span style="font-size:12.5px;color:var(--muted)">Скидка считается на сервере — в корзине и в карточке заказа у менеджера одна логика</span></div>
    <div class="code">TRUE10</div>
  </div>`;
}

function cart(){
  const list = cartList();
  if(!list.length) return `
    <div style="margin:40px 0 60px">
      <div class="empty"><b>Корзина пуста</b>Добавь что-нибудь из каталога — или выбери цель, и мы соберём стек
        <div style="margin-top:16px"><button class="b2" data-go="shop">В каталог</button></div>
      </div>
    </div>`;
  return `
  <div class="sect" style="margin-top:28px"><h2>Корзина</h2><span>${cartCount()} товара · цены пересчитываются на сервере</span></div>
  <div class="cart">
    <section>
      ${list.map(({p,q})=>`
        <div class="ci">
          <span class="cj" style="background:${p.c}"></span>
          <div class="cb"><div class="brand">${p.b}</div><div class="pn" style="margin:2px 0 0">${p.n}</div>
            <div style="font-size:12px;color:var(--muted)">${p.per}</div></div>
          <div class="qty"><button data-q="-${p.id}">−</button><b>${q}</b><button data-q="+${p.id}">+</button></div>
          <div class="pp" style="width:96px;text-align:right">${fmt(p.price*q)} ₽</div>
          <button data-rm="${p.id}" title="Убрать" style="color:#6d80a2;padding:6px">✕</button>
        </div>`).join("")}
    </section>
    <aside class="sum">
      <div class="sr">Товары<b>${fmt(subtotal())} ₽</b></div>
      <div class="sr">Доставка<b>самовывоз</b></div>
      ${state.promoOn?`<div class="sr" style="color:#7dffb3">Промокод TRUE10<b style="color:#7dffb3">−${fmt(discount())} ₽</b></div>`:""}
      <div class="promo">
        <input id="promo" placeholder="Промокод" value="${state.promo}" />
        <button data-promo="1">Применить</button>
      </div>
      <div class="sr tot">Итого<b>${fmt(total())} ₽</b></div>
      <button class="b1" data-order="1">Оформить заказ</button>
      <div class="hintbar">После оформления карточка заказа уходит менеджеру в Telegram, а статусы из чата пишутся в ту же базу.</div>
    </aside>
  </div>`;
}

function admin(){
  const o = state.orders.find(x=>x.id===state.sel) || state.orders[0];
  const week = state.orders.reduce((s,x)=>s+x.sum,0);
  return `
  <div class="sect" style="margin-top:28px"><h2>Админка · заказы</h2><span>Клик по строке — карточка уходит менеджеру в Telegram</span></div>
  <div class="adm">
    <section>
      <div class="cards" style="grid-template-columns:repeat(4,1fr);padding-bottom:14px">
        ${[["Заказов",state.orders.length],["Средний чек",fmt(Math.round(week/state.orders.length))+" ₽"],["Выручка",fmt(week)+" ₽"],["Новых",state.orders.filter(x=>x.st==="new").length]]
          .map(([k,v])=>`<div class="p" style="padding:13px 15px"><div class="brand">${k}</div><div style="font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:4px">${v}</div></div>`).join("")}
      </div>
      <table>
        <tr><th>Заказ</th><th>Клиент</th><th>Состав</th><th>Сумма</th><th>Промокод</th><th>Статус</th><th>Создан</th></tr>
        ${state.orders.map(x=>`
          <tr class="${x.id===o.id?"sel":""}" data-ord="${x.id}" style="cursor:pointer">
            <td class="mono">${x.id}</td><td>${x.cl}</td><td>${x.items}</td>
            <td style="font-variant-numeric:tabular-nums;font-weight:700">${fmt(x.sum)} ₽</td>
            <td class="mono">${x.promo||"—"}</td>
            <td><span class="st ${ST[x.st][0]}">${ST[x.st][1]}</span></td>
            <td style="color:#7f93b5">${x.t}</td>
          </tr>`).join("")}
      </table>
      <div class="hintbar">Next.js 15 · Prisma · SQLite локально, Postgres в проде · webhook POST /api/telegram/webhook</div>
    </section>

    <aside class="tg">
      <div class="tgh"><div class="tga">TP</div><div><div style="font-size:13.5px;font-weight:700">True Protein · заказы</div><div style="font-size:11px;color:#7d8e9e">бот · менеджерский чат</div></div></div>
      <div class="tgb">
        <div class="msg">
          <div class="ttl">🧾 Заказ ${o.id}</div>
          <div class="ln"><span>Клиент</span><b>${o.cl}</b></div>
          <div class="ln"><span>Состав</span><b style="text-align:right">${o.items}</b></div>
          ${o.promo?`<div class="ln"><span>Промокод ${o.promo}</span><b>−${fmt(Math.round(o.sum/9))} ₽</b></div>`:""}
          <hr/>
          <div class="ln"><span><b>Итого</b></span><b>${fmt(o.sum)} ₽</b></div>
          <div class="kb">
            ${Object.entries(ST).map(([k,v])=>`<button class="kbtn ${o.st===k?"on":""}" data-set="${k}">${v[1]}</button>`).join("")}
          </div>
        </div>
        <div class="hintbar">Нажми статус — он поменяется и в таблице слева. Это и есть «одна база» на витрину, админку и бота.</div>
      </div>
    </aside>
  </div>`;
}

function render(){
  const v = {shop,cart,admin};
  $("#app").innerHTML = (v[state.page]||shop)();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===state.page));
  const n = cartCount();
  $("#cartN").hidden = !n; $("#cartN").textContent = n;
  $("#cartSum").textContent = fmt(total()) + " ₽";
}
function go(p){ state.page=p; const h="#/"+p; if(location.hash!==h) location.hash=h; render(); window.scrollTo({top:0}); }

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-goal],[data-add],[data-q],[data-rm],[data-promo],[data-order],[data-ord],[data-set]");
  if(!t) return;
  if(t.dataset.go!==undefined && t.dataset.go) return go(t.dataset.go);
  if(t.dataset.goal!==undefined){ state.goal = t.dataset.goal || null; return render(); }
  if(t.dataset.add){ const id=+t.dataset.add; state.cart[id]=(state.cart[id]||0)+1; toast("Добавлено в корзину"); return render(); }
  if(t.dataset.q){ const s=t.dataset.q[0], id=+t.dataset.q.slice(1);
    state.cart[id] = Math.max(0,(state.cart[id]||0)+(s==="+"?1:-1));
    if(!state.cart[id]) delete state.cart[id]; return render(); }
  if(t.dataset.rm){ delete state.cart[+t.dataset.rm]; return render(); }
  if(t.dataset.promo){
    const v = ($("#promo").value||"").trim().toUpperCase();
    state.promo = v;
    if(v==="TRUE10"){ state.promoOn=true; toast("Промокод применён — минус 10%"); }
    else { state.promoOn=false; toast(v?"Такого промокода нет":"Введи промокод"); }
    return render();
  }
  if(t.dataset.order){
    const n = cartCount(), sum = total();
    state.orders.unshift({id:"#"+(1043+state.orders.length-5),cl:"Гость (демо)",items:cartList().map(x=>x.p.n.split(" · ")[0]).join(" · "),sum,promo:state.promoOn?"TRUE10":"",st:"new",t:"сейчас"});
    state.cart={}; state.promoOn=false; state.promo="";
    toast(`Заказ оформлен · ${n} товара на ${fmt(sum)} ₽ — карточка ушла в Telegram`);
    state.sel = state.orders[0].id;
    return go("admin");
  }
  if(t.dataset.ord){ state.sel=t.dataset.ord; return render(); }
  if(t.dataset.set){
    const o = state.orders.find(x=>x.id===state.sel);
    if(o){ o.st=t.dataset.set; toast(`${o.id}: статус «${ST[o.st][1]}» записан в базу`); render(); }
  }
});

function fromHash(){
  const w = (location.hash||"").replace(/^#\/?/,"").trim();
  state.page = ["shop","cart","admin"].includes(w) ? w : "shop";
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
