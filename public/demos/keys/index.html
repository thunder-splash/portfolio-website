<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keys Reseller — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#090b0e;--elev:#14181e;--ink:#f4f6f8;--muted:#8b939e;--line:rgba(255,255,255,.08);--ok:#3dd68c;--bad:#ff6b6b;--warn:#ffb020;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 Manrope,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{width:min(860px,calc(100% - 32px));margin:0 auto;padding-bottom:48px}
header{position:sticky;top:0;z-index:20;background:rgba(9,11,14,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{display:flex;align-items:center;gap:16px;height:60px}
.lg{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;letter-spacing:-.01em;flex:none}
.lg i{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,#3dd68c,#1d9c61);display:grid;place-items:center;font-style:normal}
nav{display:flex;gap:2px;font-size:13px;font-weight:600;color:var(--muted)}
nav button{padding:7px 11px;border-radius:8px}
nav button.on{background:rgba(61,214,140,.12);color:#8af0bd}
nav button:hover:not(.on){background:rgba(255,255,255,.05)}
.tgcta{margin-left:auto;height:34px;padding:0 14px;border-radius:9px;background:var(--ok);color:#06240f;font-weight:800;font-size:12.5px}
h1{font-size:25px;letter-spacing:-.025em;margin:24px 0 7px;font-weight:800}
.lead{color:var(--muted);font-size:14px;max-width:620px}
.seo{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.seo span{font-size:11.5px;font-weight:600;color:#9aa3ad;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:#101419}
.prod{margin-top:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--elev);padding:18px;display:grid;grid-template-columns:1fr 210px;gap:20px}
.pt{font-size:18px;font-weight:800;letter-spacing:-.02em}
.pm{font-size:12.5px;color:var(--muted);margin-top:3px}
.rows{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.rw{display:flex;align-items:center;gap:9px;font-size:13px;color:#c9d0d8}
.ic{width:17px;height:17px;border-radius:6px;background:rgba(61,214,140,.14);display:grid;place-items:center;flex:none}
.buy{border-left:1px solid var(--line);padding-left:20px;display:flex;flex-direction:column}
.price{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.price s{display:block;font-size:12.5px;font-weight:600;color:#6f7884;text-decoration:none;margin-top:2px}
.stock{margin-top:10px;font-size:12px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:6px}
.stock:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.stock.low{color:var(--warn)}.stock.low:before{background:var(--warn)}
.bbtn{margin-top:14px;height:42px;border-radius:11px;background:var(--ok);color:#06240f;font-weight:800;font-size:14px;box-shadow:0 10px 24px rgba(61,214,140,.18)}
.bbtn:hover{filter:brightness(1.08)}
.pay{margin-top:9px;font-size:11.5px;color:var(--muted);text-align:center}
.cat{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.c{border:1px solid var(--line);border-radius:12px;background:var(--elev);padding:13px;text-align:left;transition:.15s}
.c:hover{border-color:rgba(61,214,140,.4);transform:translateY(-2px)}
.c.on{border-color:var(--ok);background:rgba(61,214,140,.07)}
.cn{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.cp{margin-top:9px;display:flex;align-items:baseline;justify-content:space-between}
.cp b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.cp span{font-size:11.5px;color:var(--ok);font-weight:700}
.guide{margin-top:16px;border:1px dashed rgba(255,255,255,.14);border-radius:12px;padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.6}
.guide b{color:#dfe5ec}
.orders{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--elev);overflow:hidden}
.oh{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.oh span{font-size:11.5px;color:var(--muted);font-weight:500}
.or{display:grid;grid-template-columns:78px 1fr 130px 70px 48px;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid rgba(255,255,255,.045);font-size:12.5px}
.or:first-of-type{border-top:0}
.om{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#8af0bd}
.ost{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;justify-self:start;white-space:nowrap}
.ost.ok{background:rgba(61,214,140,.12);color:var(--ok)}
.ost.wait{background:rgba(255,176,32,.12);color:#ffc266}
.ost.bad{background:rgba(255,107,107,.12);color:var(--bad)}
.opr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.otm{font-size:11.5px;color:#6f7884;text-align:right;font-variant-numeric:tabular-nums}
/* bot */
.phone{width:min(430px,calc(100% - 32px));margin:24px auto 40px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#17212b;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;height:min(720px,calc(100vh - 120px))}
.tgh{height:54px;display:flex;align-items:center;gap:11px;padding:0 15px;background:#1f2c3a;flex:none}
.tga{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#3dd68c,#1d9c61);display:grid;place-items:center;font-size:12px;font-weight:800;color:#06240f}
.body{flex:1;padding:14px 13px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;background:#0e1621 radial-gradient(380px 220px at 85% 8%,rgba(61,214,140,.06),transparent 60%)}
.day{align-self:center;font-size:10.5px;color:#8aa0b4;background:rgba(0,0,0,.3);padding:3px 10px;border-radius:999px;flex:none}
.m{max-width:86%;background:#182533;border-radius:13px 13px 13px 4px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:#e9f0f7;animation:pop .22s ease;flex:none}
.m.me{align-self:flex-end;background:#2b5278;border-radius:13px 13px 4px 13px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m .t{font-weight:800;color:#8af0bd;margin-bottom:5px;font-size:13px}
.m .ln{display:flex;justify-content:space-between;gap:10px;padding:1.5px 0;color:#b9c9d8}
.m .ln b{color:#e9f0f7;font-variant-numeric:tabular-nums}
.kb{display:grid;gap:4px;margin-top:9px}
.kb2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.kbtn{background:rgba(61,214,140,.14);border:1px solid rgba(61,214,140,.26);border-radius:8px;padding:8px;text-align:center;font-size:11.5px;font-weight:700;color:#9df0c6;width:100%}
.kbtn:hover{background:rgba(61,214,140,.26)}
.kbtn.b{background:rgba(94,160,255,.14);border-color:rgba(94,160,255,.28);color:#b7d2ff}
.kbtn.b:hover{background:rgba(94,160,255,.26)}
.key{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.06em;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px;margin-top:8px;color:#b9f5d6;text-align:center}
.tm{font-size:10px;color:#7d8e9e;text-align:right;margin-top:5px}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:6px;height:6px;border-radius:50%;background:#6d7f8f;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.inp{height:48px;border-top:1px solid rgba(0,0,0,.3);background:#17212b;display:flex;align-items:center;padding:0 13px;gap:9px;font-size:12.5px;color:#6d7f8f;flex:none}
.restart{margin-left:auto;color:#8af0bd;font-weight:700;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101419;border:1px solid var(--line);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media(max-width:720px){.prod{grid-template-columns:1fr}.buy{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.cat{grid-template-columns:1fr}.or{grid-template-columns:70px 1fr 90px;grid-auto-rows:auto}.opr,.otm{display:none}nav{display:none}}
</style>
</head>
<body>
<header><div class="wrap hin">
  <div class="lg"><i><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#06240f" stroke-width="2.4"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 9-9M16.5 6.5l3 3"/></svg></i>Keys Reseller</div>
  <nav id="nav">
    <button data-go="shop" class="on">Витрина</button>
    <button data-go="bot">Бот</button>
    <button data-go="admin">Заказы</button>
  </nav>
  <button class="tgcta" data-go="bot">Купить в боте</button>
</div></header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const GOODS = [
  {id:"ofp",n:"Office Pro 2021 · 1 ПК",sku:"OFP-2021-RET",price:24.90,partner:19.20,stock:142},
  {id:"w11",n:"Windows 11 Pro",sku:"W11-PRO-RET",price:18.40,partner:14.10,stock:86},
  {id:"ofh",n:"Office Home 2021",sku:"OFH-2021-RET",price:14.20,partner:11.30,stock:230},
  {id:"prj",n:"Project Pro 2021",sku:"PRJ-2021-RET",price:31.70,partner:26.40,stock:9},
];
const ORD = [
  {id:"#A-10472",g:"Office Pro 2021",st:"ok",p:24.90,ms:"11.4 с"},
  {id:"#A-10471",g:"Windows 11 Pro",st:"ok",p:18.40,ms:"9.1 с"},
  {id:"#A-10470",g:"Office Home 2021",st:"wait",p:14.20,ms:"—"},
  {id:"#A-10469",g:"Project Pro 2021",st:"bad",p:31.70,ms:"4.0 с"},
];
const STL = {ok:["ok","выдан"],wait:["wait","ждёт оплаты"],bad:["bad","возврат · нет стока"]};

const state = {page:"shop",good:"ofp",chat:[],step:0,orders:ORD.map(o=>({...o})),n:10473};
const $ = s=>document.querySelector(s);
const money = v=>v.toFixed(2)+" $";
let tid; const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tid);tid=setTimeout(()=>t.classList.remove("show"),1900);};
const tick = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#3dd68c" stroke-width="3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

function shop(){
  const g = GOODS.find(x=>x.id===state.good);
  return `<div class="wrap">
    <h1>${g.n} — ключ активации</h1>
    <div class="lead">Выдача автоматическая: после оплаты бэкенд покупает сток у партнёра по HMAC-подписи и отдаёт код. Наценка и пол прибыли считаются на сервере.</div>
    <div class="seo"><span>SSR · индексируется</span><span>JSON-LD Product</span><span>sitemap</span><span>канонические URL</span></div>

    <div class="prod">
      <div>
        <div class="pt">${g.n}</div>
        <div class="pm">Артикул ${g.sku} · регион Global</div>
        <div class="rows">
          <div class="rw"><span class="ic">${tick}</span>Выдача сразу после оплаты — обычно до 30 секунд</div>
          <div class="rw"><span class="ic">${tick}</span>Оплата криптой через CryptoBot, счёт на 15 минут</div>
          <div class="rw"><span class="ic">${tick}</span>Если сток кончился — возврат автоматом, без тикета</div>
          <div class="rw"><span class="ic">${tick}</span>История покупок и повторная выдача ключа в боте</div>
        </div>
      </div>
      <div class="buy">
        <div class="price">${money(g.price)}<s>партнёр ${money(g.partner)} · маржа ${Math.round((g.price-g.partner)/g.price*100)}%</s></div>
        <div class="stock ${g.stock<20?"low":""}">${g.stock<20?"мало":"в наличии"} · ${g.stock} шт</div>
        <button class="bbtn" data-buy="1">Оплатить в боте</button>
        <div class="pay">CryptoBot · USDT, TON, BTC</div>
      </div>
    </div>

    <div class="cat">
      ${GOODS.filter(x=>x.id!==g.id).map(x=>`
        <button class="c" data-good="${x.id}"><div class="cn">${x.n}</div>
          <div class="cp"><b>${money(x.price)}</b><span>${x.stock} шт</span></div></button>`).join("")}
    </div>

    <div class="orders">
      <div class="oh">Последние заказы<span>витрина и бот пишут в одну таблицу</span></div>
      ${state.orders.map(o=>`<div class="or">
        <span class="om">${o.id}</span><span>${o.g}</span>
        <span class="ost ${STL[o.st][0]}">${STL[o.st][1]}</span>
        <span class="opr">${money(o.p)}</span><span class="otm">${o.ms}</span></div>`).join("")}
    </div>

    <div class="guide"><b>Почему это не просто бот.</b> Turborepo: <b>apps/api</b> (Fastify + Prisma + BullMQ), <b>apps/bot</b> (grammY), <b>apps/web</b> (Next.js SSR под поиск), <b>packages/partner-sdk</b> (HMAC-клиент) и <b>packages/pricing</b> с юнит-тестами на наценку. Витрина и бот читают один каталог.</div>
  </div>`;
}

function bot(){
  return `<div class="phone">
    <div class="tgh"><div class="tga">KR</div><div><div style="font-size:13.5px;font-weight:700">Keys Reseller Bot</div><div style="font-size:11px;color:#7d8e9e">бот · онлайн</div></div></div>
    <div class="body" id="chat"><div class="day">сегодня</div></div>
    <div class="inp">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6d7f8f" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Меню · /start · /orders
      <button class="restart" data-restart="1">начать заново</button>
    </div>
  </div>`;
}

function admin(){
  const sum = state.orders.filter(o=>o.st==="ok").reduce((s,o)=>s+o.p,0);
  return `<div class="wrap">
    <h1>Заказы</h1>
    <div class="lead">Одна таблица на витрину и бота. Выдача, возврат и ожидание оплаты — состояния одной записи.</div>
    <div class="cat" style="grid-template-columns:repeat(3,1fr);margin-top:18px">
      <div class="c"><div class="cn">Выдано</div><div class="cp"><b>${state.orders.filter(o=>o.st==="ok").length}</b><span>за сегодня</span></div></div>
      <div class="c"><div class="cn">Выручка</div><div class="cp"><b>${money(sum)}</b><span>оплачено</span></div></div>
      <div class="c"><div class="cn">Возвраты</div><div class="cp"><b>${state.orders.filter(o=>o.st==="bad").length}</b><span>нет стока</span></div></div>
    </div>
    <div class="orders">
      <div class="oh">Все заказы<span>нажми «Оплатить в боте» на витрине — тут появится новый</span></div>
      ${state.orders.map(o=>`<div class="or">
        <span class="om">${o.id}</span><span>${o.g}</span>
        <span class="ost ${STL[o.st][0]}">${STL[o.st][1]}</span>
        <span class="opr">${money(o.p)}</span><span class="otm">${o.ms}</span></div>`).join("")}
    </div>
    <div class="guide">Наценка и пол прибыли живут в <b>packages/pricing</b> и покрыты тестами: продать ниже пола нельзя ни с витрины, ни из бота.</div>
  </div>`;
}

/* ---- bot conversation ---- */
function addMsg(html, me){
  const box = $("#chat"); if(!box) return;
  const d = document.createElement("div");
  d.className = "m" + (me ? " me" : "");
  d.innerHTML = html;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function typing(ms){
  return new Promise(res=>{
    const box = $("#chat"); if(!box) return res();
    const d = document.createElement("div");
    d.className="m"; d.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
    box.appendChild(d); box.scrollTop = box.scrollHeight;
    setTimeout(()=>{ d.remove(); res(); }, ms);
  });
}
const now = () => new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});

async function chatStart(){
  const g = GOODS.find(x=>x.id===state.good);
  $("#chat").innerHTML = '<div class="day">сегодня</div>';
  addMsg(`${g.n}<div class="tm">${now()}</div>`, true);
  await typing(650);
  addMsg(`<div class="t">🧾 Счёт на оплату</div>
    <div class="ln"><span>Товар</span><b>${g.n}</b></div>
    <div class="ln"><span>Цена</span><b>${money(g.price)}</b></div>
    <div class="ln"><span>Действует</span><b>15:00 мин</b></div>
    <div class="kb">
      <button class="kbtn b" data-chat="pay">💳 Оплатить через CryptoBot</button>
      <div class="kb2"><button class="kbtn" data-chat="check">Проверить оплату</button><button class="kbtn" data-chat="cancel">Отменить</button></div>
    </div>
    <div class="tm">${now()}</div>`);
}

async function chatPay(){
  addMsg(`Оплатил<div class="tm">${now()}</div>`, true);
  await typing(700);
  addMsg(`<div class="t">✅ Оплата получена</div>Забираю сток у партнёра…<div class="tm">${now()}</div>`);
  await typing(1100);
  const g = GOODS.find(x=>x.id===state.good);
  const id = "#A-" + state.n++;
  const ms = (8 + Math.random()*6).toFixed(1) + " с";
  if(g.stock < 20 && Math.random() < .5){
    state.orders.unshift({id,g:g.n,st:"bad",p:g.price,ms});
    addMsg(`<div class="t" style="color:#ff9b9b">↩️ Сток кончился</div>
      Партнёр не отдал ключ — деньги вернулись автоматически, тикет создавать не нужно.
      <div class="ln"><span>Заказ</span><b>${id}</b></div>
      <div class="kb"><button class="kbtn" data-chat="restart">Выбрать другой товар</button></div>
      <div class="tm">${now()}</div>`);
    toast("Возврат оформлен автоматом — так работает защита от пустого стока");
  } else {
    state.orders.unshift({id,g:g.n,st:"ok",p:g.price,ms});
    addMsg(`<div class="t">🔑 Ключ готов</div>
      <div class="ln"><span>Заказ</span><b>${id}</b></div>
      <div class="ln"><span>Выдан за</span><b>${ms}</b></div>
      <div class="key">XXXXX-XXXXX-XXXXX-XXXXX-XXXXX</div>
      <div class="kb"><div class="kb2">
        <button class="kbtn" data-chat="guide">Инструкция</button>
        <button class="kbtn" data-go2="admin">Мои заказы</button></div>
        <button class="kbtn b" data-chat="restart">Купить ещё</button></div>
      <div class="tm">${now()}</div>`);
    toast("Ключ выдан · заказ записан в общую таблицу");
  }
}

function render(){
  const v={shop,bot,admin};
  $("#app").innerHTML = (v[state.page]||shop)();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===state.page));
  if(state.page==="bot") chatStart();
}
function go(p){ state.page=p; const h="#/"+p; if(location.hash!==h) location.hash=h; render(); window.scrollTo({top:0}); }

document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-go],[data-go2],[data-good],[data-buy],[data-chat],[data-restart]");
  if(!t) return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.go2) return go(t.dataset.go2);
  if(t.dataset.good){ state.good=t.dataset.good; return render(); }
  if(t.dataset.buy) return go("bot");
  if(t.dataset.restart) return chatStart();
  const a = t.dataset.chat;
  if(a==="pay") return chatPay();
  if(a==="check"){ addMsg(`<div class="t">⏳ Оплата не найдена</div>Счёт ещё не закрыт — проверю сам, как только придёт платёж.<div class="tm">${now()}</div>`); return; }
  if(a==="cancel"){ addMsg(`<div class="t">Счёт отменён</div>Ничего не списано.<div class="kb"><button class="kbtn" data-chat="restart">Начать заново</button></div><div class="tm">${now()}</div>`); return; }
  if(a==="guide"){ addMsg(`<div class="t">📄 Как активировать</div>Параметры → Система → Активация → «Изменить ключ продукта».<div class="tm">${now()}</div>`); return; }
  if(a==="restart") return chatStart();
});

function fromHash(){
  const w=(location.hash||"").replace(/^#\/?/,"").trim();
  state.page = ["shop","bot","admin"].includes(w)?w:"shop";
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
